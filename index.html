/* CAPRO design tokens
   Brand maroon #7A0019 is taken from the CAPRO presentation. */
:root {
  color-scheme: light;

  /* Colour */
  --paper: #f6f3ee;
  --surface: #fffdf9;
  --sand: #eee8df;
  --ink: #231c19;
  --ink-soft: #3d3430;
  --stone: #685e58;
  --line: #e2dad0;
  --line-strong: #c9bfb3;
  --maroon: #7a0019;
  --maroon-deep: #5c0014;
  --maroon-tint: #f2e4e3;
  --fill: #7a0019;        /* filled buttons, selected states */
  --fill-hover: #5c0014;
  --on-maroon: #f8f1ea;
  --on-maroon-soft: #e3cfc9;
  --on-maroon-line: rgba(248, 241, 234, 0.22);
  --focus: #7a0019;
  --ember: #d93a1d;          /* vermilion of the MIT emblem; small accents only */
  --grid-line: rgba(122, 0, 25, 0.075);
  --shadow-lift: 0 1px 0 rgba(35, 28, 25, 0.04), 0 22px 44px -26px rgba(70, 8, 18, 0.45);

  /* Type */
  --font-display: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --text-sm: 0.875rem;
  --text-base: 1.0625rem;
  --text-md: 1.1875rem;
  --text-lg: clamp(1.25rem, 1.1rem + 0.5vw, 1.4rem);
  --text-xl: clamp(1.55rem, 1.25rem + 1.1vw, 2.1rem);
  --text-2xl: clamp(1.9rem, 1.4rem + 1.9vw, 2.75rem);
  --text-3xl: clamp(2.4rem, 1.6rem + 3vw, 3.75rem);
  --text-hero: clamp(2.5rem, 1.4rem + 4.1vw, 4.5rem);

  /* Space & shape */
  --gutter: clamp(1.25rem, 4vw, 3rem);
  --band: clamp(3.75rem, 2.5rem + 5vw, 7.5rem);
  --band-tight: clamp(2.75rem, 2rem + 3vw, 5rem);
  --radius: 4px;
  --header-h: 4.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --paper: #1a1615;
    --surface: #221d1b;

    --ink: #f1ebe4;
    --ink-soft: #ddd4cb;
    --stone: #b1a59c;

    --fill: #96203a;
    --fill-hover: #ab2c47;
    --on-maroon: #f8f1ea;
    --on-maroon-soft: #e6d3cd;

    --ember: #ff7a5c;
    --grid-line: rgba(241, 235, 228, 0.06);
    --shadow-lift: 0 24px 48px -24px rgba(0, 0, 0, 0.85);
  }
}

/* ---------- Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 1rem);
  background: var(--paper);
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.6;
  font-feature-settings: 'kern', 'liga';
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.menu-open { overflow: hidden; }
img, svg { display: block; max-width: 100%; height: auto; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3, h4 { text-wrap: balance; }
p, li, dd { text-wrap: pretty; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 2px;
}
[tabindex='-1']:focus:not(:focus-visible) { outline: none; }

::selection { background: var(--maroon-tint); color: var(--ink); }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute;
  left: 1rem; top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  z-index: 100;
  padding: 0.7rem 1rem;
  background: var(--fill); color: var(--on-maroon);
  font-weight: 600; text-decoration: none;
  border-radius: var(--radius);
  transform: translateY(-200%);
}
.skip-link:focus { transform: none; }

/* ---------- Layout ---------- */
.wrap {
  width: 100%;
  max-width: 78rem;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.band { padding-block: var(--band); }
.band--tight { padding-block: var(--band-tight) var(--band); }
.band--sand { background: var(--sand); }
.band--rule { border-top: 1px solid var(--line); }
.band--ink {
  background: var(--maroon-deep);
  color: var(--on-maroon);
  --focus: var(--on-maroon);
}
.band--ink + .band, .band--sand + .band--sand { border-top: 1px solid var(--line); }

.split {
  display: grid;
  gap: clamp(2.5rem, 6vw, 6rem);
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 56em) {
  .split { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
  .split--even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

main:focus { outline: none; }
main.is-entering { animation: enter 260ms var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Typography ---------- */
.section-heading { max-width: 42rem; margin-bottom: clamp(2rem, 4vw, 3.25rem); }
.section-heading__title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-2xl);
  line-height: 1.12;
  letter-spacing: -0.012em;
}
.section-heading__intro {
  margin-top: 0.9rem;
  color: var(--stone);
  font-size: var(--text-md);
  max-width: 38rem;
}

.kicker-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-2xl);
  line-height: 1.12;
  letter-spacing: -0.012em;
  margin-bottom: 1.75rem;
}
.minor-title {
  font-size: var(--text-md);
  font-weight: 600;
  line-height: 1.35;
  margin-bottom: 1rem;
}
.lead-text { font-size: var(--text-lg); line-height: 1.5; margin-bottom: 1.75rem; max-width: 34rem; }

.text-link {
  display: inline-block;
  color: var(--maroon);
  font-weight: 600;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.3em;
  transition: text-decoration-thickness 150ms;
}
.text-link:hover { text-decoration-thickness: 2px; }
.band--ink .text-link { color: var(--on-maroon); }

.link-button {
  background: none; border: 0; padding: 0;
  color: var(--maroon); font-weight: 600; cursor: pointer;
  text-decoration: underline; text-underline-offset: 0.3em;
}

/* Lists */
.plain-list > li {
  position: relative;
  padding-left: 1.5rem;
  margin-bottom: 0.85rem;
  max-width: 38rem;
}
.plain-list > li::before {
  content: '';
  position: absolute;
  left: 0; top: 0.8em;
  width: 0.7rem; height: 1px;
  background: var(--maroon);
}
.plain-list + .text-link { margin-top: 1rem; }
.plain-list--links a { color: var(--maroon); font-weight: 500; }

.statements > li {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  line-height: 1.22;
  letter-spacing: -0.01em;
  padding-block: 1.1rem;
  border-top: 1px solid var(--line-strong);
}
.statements > li:last-child { border-bottom: 1px solid var(--line-strong); }

.tick-list > li {
  position: relative;
  padding: 0.85rem 0 0.85rem 2rem;
  border-bottom: 1px solid var(--line);
}
.tick-list > li:first-child { border-top: 1px solid var(--line); }
.tick-list > li::before {
  content: '';
  position: absolute; left: 0.1rem; top: 1.2rem;
  width: 0.95rem; height: 0.5rem;
  border-left: 1.5px solid var(--maroon);
  border-bottom: 1.5px solid var(--maroon);
  transform: rotate(-45deg);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 3rem;
  padding: 0.75rem 1.4rem;
  border-radius: var(--radius);
  border: 1px solid transparent;
  font-weight: 600; font-size: 0.975rem; line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 160ms, border-color 160ms, color 160ms;
}
.btn--primary { background: var(--fill); color: var(--on-maroon); }
.btn--primary:hover { background: var(--fill-hover); }
.btn--quiet { border-color: var(--line-strong); color: var(--ink); background: transparent; }
.btn--quiet:hover { border-color: var(--ink); }
.btn--light { background: var(--on-maroon); color: #5c0014; }
.btn--light:hover { background: #fff; }
.btn:disabled { opacity: 0.6; cursor: progress; }

/* Notched phones: keep the sticky header clear of the status bar, with a
   paper-coloured strip behind the bar so content never shows through it. */
body::before {
  content: '';
  position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 60;
  background: var(--paper);
}

/* ---------- Logo ---------- */
.logo { display: inline-block; line-height: 0; }
.logo__img { width: auto; height: 100%; max-width: none; }
.logo__img--dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .logo__img--light { display: none; }
  :root:not([data-theme='light']) .logo__img--dark { display: block; }
}
:root[data-theme='dark'] .logo__img--light { display: none; }
:root[data-theme='dark'] .logo__img--dark { display: block; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: var(--paper);
  border-bottom: 1px solid transparent;
  transition: border-color 200ms;
}
body::before {
  content: ''; position: fixed; inset: 0 0 auto; z-index: 51;
  height: env(safe-area-inset-top, 0px);
  background: var(--paper);
}
.site-header { top: env(safe-area-inset-top, 0px); }
.site-header.is-scrolled { border-bottom-color: var(--line); }
.site-header__bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1.5rem;
  min-height: var(--header-h);
}

.brand {
  display: flex; align-items: center; gap: 1rem;
  text-decoration: none; color: var(--ink);
  min-width: 0;
}
.brand__logo { height: 1.85rem; }
.brand__divider { width: 1px; height: 2rem; background: var(--line-strong); flex: none; }
.brand__name { display: flex; flex-direction: column; line-height: 1.1; }
.brand__short {
  font-family: var(--font-display);
  font-size: 1.45rem; font-weight: 500;
  letter-spacing: 0.02em;
}
.brand__long { font-size: 0.72rem; color: var(--stone); max-width: 15rem; margin-top: 0.15rem; display: none; }
@media (max-width: 26em) {
  .brand__logo { height: 1.45rem; }
  .brand { gap: 0.7rem; }
  .brand__short { font-size: 1.2rem; }
}
@media (min-width: 64em) { .brand__logo { height: 2.15rem; } }
@media (min-width: 75em) and (max-width: 89.99em) { .brand__logo { height: 1.9rem; } }

.menu-toggle {
  display: inline-flex; align-items: center; gap: 0.6rem;
  min-height: 2.75rem; padding: 0 0.85rem;
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: transparent; cursor: pointer;
  font-weight: 600; font-size: 0.9rem;
  flex: none;
}
.menu-toggle__icon { display: grid; gap: 5px; width: 18px; }
.menu-toggle__icon span { height: 1.5px; background: currentColor; transition: transform 200ms var(--ease); }
.is-open .menu-toggle__icon span:first-child { transform: translateY(3.25px) rotate(45deg); }
.is-open .menu-toggle__icon span:last-child { transform: translateY(-3.25px) rotate(-45deg); }

.site-nav__link {
  display: block;
  text-decoration: none;
  color: var(--ink-soft);
  font-weight: 500;
}
.site-nav__link[aria-current='page'] { color: var(--maroon); }

/* Mobile and tablet: full-height panel */
@media (max-width: 74.99em) {
  .site-nav {
    position: fixed;
    /* Explicit height: the sticky header can become this panel's containing block. */
    top: var(--header-h); left: 0; right: 0; bottom: auto;
    height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px));
    height: calc(100dvh - var(--header-h) - env(safe-area-inset-top, 0px));
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 1.5rem var(--gutter) calc(2rem + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    visibility: hidden; opacity: 0;
    transform: translateY(-0.5rem);
    transition: opacity 200ms var(--ease), transform 200ms var(--ease), visibility 0s 200ms;
  }
  .is-open .site-nav {
    visibility: visible; opacity: 1; transform: none;
    transition: opacity 220ms var(--ease), transform 220ms var(--ease);
  }
  .site-nav__link {
    font-family: var(--font-display);
    font-size: 1.75rem; line-height: 1.2;
    padding-block: 0.8rem;
    border-bottom: 1px solid var(--line);
  }
}
/* Desktop: inline */
@media (min-width: 75em) {
  .menu-toggle { display: none; }
  .site-nav__list { display: flex; gap: 0.25rem; }
  .site-nav__link {
    position: relative;
    font-size: 0.93rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius);
  }
  .site-nav__link:hover { color: var(--ink); }
  .site-nav__link[aria-current='page']::after {
    content: ''; position: absolute; left: 0.7rem; right: 0.7rem; bottom: 0.15rem;
    height: 1.5px; background: var(--maroon);
  }
}

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--line); background: var(--paper); }
.site-footer__inner {
  display: grid; gap: 2.5rem;
  padding-block: 3.5rem calc(2.5rem + env(safe-area-inset-bottom, 0px));
}
.site-footer__logo { height: 2.4rem; margin-bottom: 1.25rem; }
.site-footer__centre { color: var(--stone); max-width: 26rem; font-size: 0.95rem; }
.site-footer__centre strong { color: var(--ink); font-weight: 600; margin-right: 0.25rem; }
.site-footer__nav ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem 2rem; }
.site-footer__nav a { text-decoration: none; color: var(--ink-soft); font-size: 0.95rem; }
.site-footer__nav a:hover { color: var(--maroon); text-decoration: underline; text-underline-offset: 0.25em; }
.site-footer__legal { color: var(--stone); font-size: var(--text-sm); border-top: 1px solid var(--line); padding-top: 1.5rem; }
@media (min-width: 56em) {
  .site-footer__inner { grid-template-columns: 1.4fr 1fr; align-items: start; }
  .site-footer__legal { grid-column: 1 / -1; }
}
@media (max-width: 26em) { .site-footer__logo { height: 1.8rem; } }

/* ---------- Page header ---------- */
.page-header { border-bottom: 1px solid var(--line); }
.page-header__inner { padding-block: clamp(2.5rem, 6vw, 5rem) clamp(2.25rem, 4vw, 3.5rem); }
.page-header__title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-3xl);
  line-height: 1.06;
  letter-spacing: -0.018em;
  max-width: 22ch;
}
.page-header__lede {
  margin-top: 1.25rem;
  font-size: var(--text-lg);
  line-height: 1.5;
  color: var(--ink-soft);
  max-width: 40rem;
}
.page-header__actions { margin-top: 2rem; }

.crumbs { margin-bottom: 1.5rem; font-size: var(--text-sm); }
.crumbs ol { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.crumbs li { display: inline-flex; gap: 0.25rem; color: var(--stone); }
.crumbs li + li::before { content: '/'; color: var(--line-strong); padding-right: 0.25rem; }
.crumbs a { color: var(--stone); text-decoration: none; }
.crumbs a:hover { color: var(--maroon); text-decoration: underline; text-underline-offset: 0.25em; }

.jump { margin-top: 2.25rem; }
.jump ul { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.jump a {
  display: inline-flex; align-items: center; gap: 0.7rem;
  padding: 0.6rem 1rem 0.6rem 0.65rem;
  border: 1px solid var(--line-strong); border-radius: 999px;
  text-decoration: none; font-weight: 500; font-size: 0.95rem;
}
.jump a:hover { border-color: var(--maroon); color: var(--maroon); }
.jump__num {
  display: inline-grid; place-items: center;
  width: 1.6rem; height: 1.6rem; border-radius: 50%;
  background: var(--maroon-tint); color: var(--maroon);
  font-family: var(--font-display); font-size: 0.95rem;
}

/* ---------- Studio line ---------- */
.studio { --active: 0; --n: 6; }
.studio__rail { display: grid; gap: 1rem; }
.studio__end {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 1.05rem;
  color: var(--stone);
}
.studio__track { position: relative; }
.studio__stations { display: grid; position: relative; z-index: 1; }
.studio__station {
  display: grid;
  align-items: center;
  background: none; border: 0; padding: 0;
  text-align: left;
  cursor: pointer;
  color: var(--ink-soft);
}
.studio__dot {
  width: 0.95rem; height: 0.95rem; border-radius: 50%;
  background: var(--paper);
  border: 1.5px solid var(--line-strong);
  transition: background-color 200ms, border-color 200ms, transform 200ms var(--ease);
}
.band--sand .studio__dot { background: var(--sand); }
.studio__num {
  font-family: var(--font-display);
  font-size: 0.95rem;
  color: var(--stone);
  font-variant-numeric: tabular-nums;
}
.studio__role { font-weight: 500; font-size: 0.95rem; line-height: 1.3; }
.studio__station:hover .studio__dot { border-color: var(--maroon); }
.studio__station:hover .studio__role { color: var(--ink); }
.studio__station[aria-selected='true'] { color: var(--ink); }
.studio__station[aria-selected='true'] .studio__dot {
  background: var(--fill); border-color: var(--fill); transform: scale(1.3);
}
.studio__station[aria-selected='true'] .studio__num { color: var(--maroon); }
.studio__station:focus-visible { outline-offset: 6px; }

.studio__line {
  position: absolute;
  background: var(--line-strong);
  transform-origin: left top;
}
.studio__line::after {
  content: ''; position: absolute; inset: 0;
  background: var(--fill);
  transform-origin: inherit;
  transition: transform 420ms var(--ease);
}

/* Entrance: draw the line, then reveal stations in order (once). */
.studio:not(.is-drawn) .studio__line { transform: scale(0, 1); }
.studio.is-drawn .studio__line { transition: transform 1100ms var(--ease); }
.studio:not(.is-drawn) .studio__station { opacity: 0; }
.studio.is-drawn .studio__station { transition: opacity 500ms var(--ease) calc(250ms + var(--i) * 110ms); }
html:not(.is-ready) .studio__line, html:not(.is-ready) .studio__station { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .studio .studio__line { transform: none !important; }
  .studio .studio__station { opacity: 1 !important; }
}

/* Vertical (small screens) */
@media (max-width: 47.99em) {
  .studio__stations { gap: 0.25rem; }
  .studio__station {
    grid-template-columns: 0.95rem 1.5rem 1fr;
    column-gap: 0.9rem;
    min-height: 2.9rem;
  }
  .studio__line {
    left: calc(0.475rem - 0.75px); width: 1.5px;
    top: 1.45rem; bottom: 1.45rem;
  }
  .studio:not(.is-drawn) .studio__line { transform: scale(1, 0); }
  .studio__line::after { transform: scale(1, calc(var(--active) / (var(--n) - 1))); }
  .studio__end--start { padding-left: 1.85rem; }
  .studio__end--finish { padding-left: 1.85rem; }
}
/* Horizontal (tablet and up) */
@media (min-width: 48em) {
  .studio__rail { gap: 1.25rem; }
  .studio__end { display: block; }
  .studio__stations { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .studio__station {
    grid-template-rows: 0.95rem auto auto;
    align-items: start;
    align-content: start;
    justify-items: center;
    text-align: center;
    row-gap: 0.75rem;
    padding-inline: 0.4rem;
  }
  .studio__num { margin-top: 0.35rem; }
  .studio__line {
    top: calc(0.475rem - 0.75px); height: 1.5px;
    left: calc(100% / var(--n) / 2); right: calc(100% / var(--n) / 2);
  }
  .studio__line::after { transform: scale(calc(var(--active) / (var(--n) - 1)), 1); }
  .studio__end--finish { text-align: right; }
}

.studio__panel {
  margin-top: clamp(2rem, 4vw, 3rem);
  padding: 1.6rem 1.75rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--fill);
  border-radius: var(--radius);
  max-width: 44rem;
}
.studio__panel.is-changing > * { animation: swap 280ms var(--ease) both; }
@keyframes swap { from { opacity: 0; transform: translateY(4px); } }
.studio__panel-step { font-size: var(--text-sm); color: var(--stone); }
.studio__panel-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-xl);
  line-height: 1.2;
  margin: 0.25rem 0 0.6rem;
}
.studio__panel-text { max-width: 36rem; }

/* ---------- Focus areas ---------- */
.focus-pair { display: grid; gap: 1.25rem; }
@media (min-width: 52em) { .focus-pair { grid-template-columns: 1fr 1fr; gap: 1.5rem; } }
.focus-card {
  display: flex; flex-direction: column; gap: 0.9rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(1.75rem, 3.5vw, 2.75rem);
}
.focus-card__num {
  font-family: var(--font-display);
  font-size: 3.25rem; line-height: 1;
  color: var(--maroon);
}
.focus-card__title { font-family: var(--font-display); font-weight: 400; font-size: var(--text-xl); line-height: 1.15; }
.focus-card p { max-width: 32rem; }
.focus-card__count { color: var(--stone); font-size: var(--text-sm); margin-top: auto; padding-top: 0.75rem; border-top: 1px solid var(--line); }

.focus-section:focus { outline: none; }
.focus-head {
  display: grid; gap: 1rem 2rem;
  margin-bottom: clamp(2.25rem, 4vw, 3.5rem);
}
@media (min-width: 48em) { .focus-head { grid-template-columns: 5.5rem minmax(0, 1fr); } }
.focus-head__num {
  font-family: var(--font-display);
  font-size: clamp(3.5rem, 2.5rem + 3vw, 5.5rem); line-height: 0.9;
  color: var(--maroon);
}
.focus-head__title { font-family: var(--font-display); font-weight: 400; font-size: var(--text-2xl); line-height: 1.1; letter-spacing: -0.012em; }
.focus-head__summary { margin-top: 0.9rem; font-size: var(--text-md); max-width: 40rem; }
.focus-head__objective { margin-top: 0.9rem; color: var(--stone); font-size: 0.95rem; max-width: 40rem; }

.role-grid {
  display: grid; gap: 0 2.5rem;
  margin-top: clamp(3rem, 5vw, 4rem);
}
@media (min-width: 48em) { .role-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 70em) { .role-grid { grid-template-columns: repeat(3, 1fr); } }
.role-grid__item { padding-block: 1.25rem; border-top: 1px solid var(--line-strong); }
.role-grid dt { font-weight: 600; margin-bottom: 0.35rem; }
.role-grid dd { color: var(--ink-soft); }
.after-note { margin-top: 2.5rem; }

/* ---------- Projects ---------- */
.heading-row { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 0 2rem; }
.heading-row__link { margin-bottom: clamp(2rem, 4vw, 3.25rem); }

.project-list { border-top: 1px solid var(--line-strong); }
.project-row { border-bottom: 1px solid var(--line); }
.project-row__link {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.4rem 1.5rem;
  padding-block: 1.5rem;
  text-decoration: none;
  color: inherit;
}
.project-row__title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-lg);
  line-height: 1.25;
  transition: color 150ms;
}
.project-row__summary { color: var(--stone); grid-column: 1; max-width: 40rem; }
.project-row__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; grid-column: 1; margin-top: 0.4rem; }
.project-row__area { font-size: var(--text-sm); color: var(--stone); }
.project-row__arrow {
  grid-column: 2; grid-row: 1 / span 3; align-self: center;
  color: var(--stone);
  transition: transform 200ms var(--ease), color 150ms;
}
.project-row__link:hover .project-row__title { color: var(--maroon); }
.project-row__link:hover .project-row__arrow { color: var(--maroon); transform: translateX(4px); }
.project-row__link:focus-visible { outline-offset: -2px; }
@media (min-width: 60em) {
  .project-row__link { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) 11rem auto; align-items: baseline; }
  .project-row__summary { grid-column: 2; }
  .project-row__meta { grid-column: 3; margin-top: 0; flex-direction: column; align-items: flex-start; gap: 0.3rem; }
  .project-row__arrow { grid-column: 4; grid-row: 1; }
}

.status {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-size: 0.8rem; font-weight: 600;
  padding: 0.2rem 0.65rem 0.2rem 0.55rem;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  color: var(--ink-soft);
  white-space: nowrap;
}
.status::before { content: ''; width: 0.5rem; height: 0.5rem; border-radius: 50%; border: 1.5px solid currentColor; }
.status--development::before, .status--discovery::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.status--pilot, .status--live { color: var(--maroon); border-color: currentColor; }
.status--live::before, .status--pilot::before { background: currentColor; }

.filters { display: flex; flex-wrap: wrap; gap: 1rem 1.25rem; align-items: end; }
.filters .field { margin: 0; }
.field--search { flex: 1 1 18rem; max-width: 28rem; }
.filters__count { margin: 1.75rem 0 0.9rem; color: var(--stone); font-size: var(--text-sm); }
.status-note { margin-top: 2rem; color: var(--stone); font-size: 0.95rem; max-width: 44rem; }
.status-note__label { font-weight: 600; color: var(--ink-soft); }
.empty { padding: 2.5rem 0; border-bottom: 1px solid var(--line); }
.empty__title { font-family: var(--font-display); font-size: var(--text-lg); margin-bottom: 0.4rem; }

/* Project detail */
.detail { display: grid; gap: 2.5rem; }
@media (min-width: 60em) {
  .detail { grid-template-columns: 17rem minmax(0, 1fr); gap: 5rem; align-items: start; }
  .detail__aside { position: sticky; top: calc(var(--header-h) + 2rem); }
}
.facts { border-top: 1px solid var(--line-strong); }
.facts__row { padding-block: 1rem; border-bottom: 1px solid var(--line); }
.facts dt { font-size: var(--text-sm); color: var(--stone); margin-bottom: 0.3rem; }
.facts dd a { color: var(--maroon); font-weight: 500; }
.detail__main { max-width: 44rem; }
.detail-section { margin-bottom: 2.75rem; }
.detail-section h2 {
  font-family: var(--font-display); font-weight: 400;
  font-size: var(--text-xl); line-height: 1.2;
  margin-bottom: 0.85rem;
}
.detail-section > p { color: var(--ink-soft); }
.detail-callout {
  background: var(--sand);
  border-radius: var(--radius);
  padding: clamp(1.5rem, 3vw, 2.25rem);
}
.detail-callout h2 { font-family: var(--font-display); font-weight: 400; font-size: var(--text-xl); margin-bottom: 0.6rem; }
.detail-callout p { margin-bottom: 1.5rem; max-width: 34rem; }
.team-list li { display: flex; justify-content: space-between; gap: 1rem; padding-block: 0.7rem; border-bottom: 1px solid var(--line); }
.team-list__role { color: var(--stone); text-align: right; }
.timeline { border-left: 1.5px solid var(--line-strong); padding-left: 1.5rem; }
.timeline__item { position: relative; padding-bottom: 1.5rem; }
.timeline__item::before { content: ''; position: absolute; left: calc(-1.5rem - 5.5px); top: 0.45rem; width: 9px; height: 9px; border-radius: 50%; background: var(--fill); }
.timeline time { font-size: var(--text-sm); color: var(--stone); }
.timeline__title { font-weight: 600; }
.timeline__note { color: var(--ink-soft); }

.pager {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;
  padding-block: 2rem var(--band-tight);
  border-top: 1px solid var(--line);
}
.pager__link { display: flex; flex-direction: column; gap: 0.3rem; text-decoration: none; padding-block: 0.5rem; }
.pager__link--next { text-align: right; }
.pager__dir { font-size: var(--text-sm); color: var(--stone); }
.pager__title { font-family: var(--font-display); font-size: var(--text-md); line-height: 1.3; }
.pager__link:hover .pager__title { color: var(--maroon); }

/* ---------- Quote & audiences ---------- */
.quote blockquote p {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  line-height: 1.35;
  max-width: 48rem;
  text-indent: -0.42em;
}
.quote blockquote p::before { content: '“'; }
.quote blockquote p::after { content: '”'; }
.quote figcaption { margin-top: 1rem; color: var(--on-maroon-soft); font-size: var(--text-sm); }

.join-title {
  font-family: var(--font-display); font-weight: 400;
  font-size: var(--text-xl);
  margin: clamp(3.5rem, 7vw, 5.5rem) 0 1.75rem;
}
.audiences { display: grid; gap: 0 2.5rem; }
@media (min-width: 52em) { .audiences { grid-template-columns: repeat(3, 1fr); } }
.audience { padding-block: 1.5rem; border-top: 1px solid var(--on-maroon-line); display: flex; flex-direction: column; gap: 0.6rem; }
.audience__title { font-size: var(--text-md); font-weight: 600; }
.audience__text { color: var(--on-maroon-soft); flex: 1; }
.ink-actions { margin-top: 2.5rem; }

/* ---------- Spec lists ---------- */
.spec { border-top: 1px solid var(--line-strong); }
.spec__row { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1rem; padding-block: 0.95rem; border-bottom: 1px solid var(--line); }
.spec dt { color: var(--stone); font-size: 0.95rem; }
.spec dd { font-weight: 500; }
@media (max-width: 26em) { .spec__row { grid-template-columns: 1fr; gap: 0.1rem; } }

.objectives { display: grid; gap: 0 2.5rem; }
@media (min-width: 48em) { .objectives { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 70em) { .objectives { grid-template-columns: repeat(3, 1fr); } }
.objective { padding-block: 1.4rem 1.6rem; border-top: 1px solid var(--line-strong); }
.objective p { font-family: var(--font-display); font-size: var(--text-lg); line-height: 1.35; }

.measure-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; border-top: 1px solid var(--line-strong); }
.measure-list li { padding-block: 1rem; border-bottom: 1px solid var(--line); font-weight: 500; }

.value-cols { display: grid; gap: 2.5rem; }
@media (min-width: 52em) { .value-cols { grid-template-columns: 1fr 1fr; gap: 4rem; } }

.benefit-grid { display: grid; gap: 0 2.5rem; }
@media (min-width: 48em) { .benefit-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 70em) { .benefit-grid { grid-template-columns: repeat(3, 1fr); } }
.benefit { padding-block: 1.4rem 1.6rem; border-top: 1px solid var(--line-strong); }
.benefit dt { font-family: var(--font-display); font-size: var(--text-lg); line-height: 1.25; margin-bottom: 0.45rem; }
.benefit dd { color: var(--ink-soft); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.4rem; min-width: 0; border: 0; padding: 0; }
.field label, .field legend { font-weight: 600; font-size: 0.95rem; padding: 0; }
.field__optional { font-weight: 400; color: var(--stone); }
.field__hint { font-size: var(--text-sm); color: var(--stone); }
.field__error { font-size: var(--text-sm); color: var(--maroon); font-weight: 500; }
.field__error:empty { display: none; }
input[type='text'], input[type='email'], input[type='search'], select, textarea {
  width: 100%;
  min-height: 3rem;
  padding: 0.7rem 0.85rem;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  font-size: 1rem;
  transition: border-color 150ms, box-shadow 150ms;
}
select {
  appearance: none;
  padding-right: 2.5rem;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(-45deg, transparent 50%, currentColor 50%);
  background-position: calc(100% - 1.15rem) 55%, calc(100% - 0.8rem) 55%;
  background-size: 0.35rem 0.35rem;
  background-repeat: no-repeat;
}
textarea { min-height: 9rem; resize: vertical; line-height: 1.5; }
input:hover, select:hover, textarea:hover { border-color: var(--stone); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--maroon);
  box-shadow: 0 0 0 3px var(--maroon-tint);
}
[aria-invalid='true'] { border-color: var(--maroon) !important; }
.checks { display: grid; gap: 0.5rem 1.5rem; margin-top: 0.4rem; }
@media (min-width: 36em) { .checks { grid-template-columns: 1fr 1fr; } }
.check { display: flex; align-items: flex-start; gap: 0.6rem; font-weight: 400 !important; cursor: pointer; padding-block: 0.25rem; }
.check input { width: 1.1rem; height: 1.1rem; margin-top: 0.25rem; accent-color: var(--fill); flex: none; }

.contact { display: grid; gap: 3rem; }
@media (min-width: 60em) { .contact { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 5rem; } }
.audience-list > div { padding-block: 1.1rem; border-top: 1px solid var(--line); }
.audience-list dt { font-weight: 600; }
.audience-list dd { color: var(--stone); }
.form__row { display: grid; gap: 0 1.25rem; }
@media (min-width: 36em) { .form__row { grid-template-columns: 1fr 1fr; } }
.form__status {
  margin-bottom: 1.5rem; padding: 0.9rem 1.1rem;
  border-left: 3px solid var(--maroon);
  background: var(--maroon-tint);
  font-weight: 500;
}
.form__context { margin-bottom: 1.4rem; padding: 0.8rem 1rem; background: var(--sand); border-radius: var(--radius); font-size: 0.95rem; }
.form__actions { margin-top: 0.5rem; }
.form-result {
  margin-top: 2rem;
  padding: 1.75rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--fill);
  border-radius: var(--radius);
}
.form-result:focus { outline: none; }
.form-result p { margin-bottom: 1rem; max-width: 36rem; }
.form-result__text {
  white-space: pre-wrap; word-break: break-word;
  font-family: var(--font-body); font-size: 0.95rem;
  background: var(--paper); border: 1px solid var(--line);
  padding: 1rem; border-radius: var(--radius);
  margin: 0 0 1rem;
}
.form-result__copied { margin-top: 0.75rem; font-size: var(--text-sm); color: var(--stone); }

/* Narrow phones: icon-only menu button (label stays available to screen readers). */
@media (max-width: 30em) {
  .menu-toggle { padding: 0; width: 2.75rem; justify-content: center; }
  .menu-toggle__label {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
}
/* Headings receive focus after navigation for screen readers; no visible ring. */
.page-header__title:focus { outline: none; }

/* Postal address (contact page, footer) */
.address { font-style: normal; display: grid; gap: 0.1rem; color: var(--ink-soft); }
.contact__where { margin-top: 2.5rem; margin-bottom: 0.75rem; }
.address--footer { margin-top: 1rem; font-size: var(--text-sm); color: var(--stone); }

/* ---------- Home hero ---------- */
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
/* Graph-paper texture: the drawing board of a product studio. Fades out toward the copy. */
.hero::before {
  content: '';
  position: absolute; inset: 0; z-index: -1;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 2.5rem 2.5rem;
  background-position: -1px -1px;
  -webkit-mask-image: radial-gradient(ellipse 75% 95% at 82% 45%, #000 15%, transparent 72%);
  mask-image: radial-gradient(ellipse 75% 95% at 82% 45%, #000 15%, transparent 72%);
}
.hero__inner {
  display: grid;
  gap: clamp(2.5rem, 6vw, 4rem);
  padding-block: clamp(3rem, 2rem + 5vw, 6.5rem) clamp(3rem, 2rem + 4vw, 5.5rem);
  align-items: center;
}
.hero__org {
  display: flex; align-items: center; gap: 0.9rem;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: clamp(1.5rem, 3vw, 2.25rem);
}
.hero__org::before { content: ''; width: 2.25rem; height: 2px; background: var(--ember); flex: none; }
.hero__abbr { color: var(--stone); font-weight: 400; }
.hero__title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2.35rem, 1.5rem + 3.4vw, 4.1rem);
  line-height: 1.05;
  letter-spacing: -0.022em;
  max-width: 17ch;
  font-variation-settings: 'opsz' 72;
}
.hero__title:focus { outline: none; }
.hero__lede {
  margin-top: clamp(1.5rem, 3vw, 2.1rem);
  font-size: var(--text-md);
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 34rem;
}
.hero__actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: clamp(1.75rem, 3vw, 2.4rem); }
@media (min-width: 62em) {
  .hero__inner { grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr); }
}
@media (max-width: 26em) { .hero__actions .btn { width: 100%; } }

.band--studio { padding-block: var(--band); }

/* ---------- Hero wireframes ---------- */
.hv { margin: 0; }
.hv__stage { position: relative; height: 22rem; }
@media (min-width: 40em) { .hv__stage { height: 27rem; } }
.hv__card {
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: var(--shadow-lift);
  overflow: hidden;
  animation: hv-in 900ms var(--ease) both;
  animation-delay: calc(250ms + var(--d, 0) * 160ms);
}
.hv__card--a { --d: 0; left: 0; top: 0; width: 80%; z-index: 1; }
.hv__card--b { --d: 1; right: 0; top: 38%; width: 66%; z-index: 2; }
.hv__card--c { --d: 2; left: 2%; bottom: 0; width: 58%; z-index: 3; display: none; }
@media (min-width: 40em) {
  .hv__card--a { width: 70%; }
  .hv__card--b { top: 33%; width: 64%; }
  .hv__card--c { display: block; }
}
.hv__bar {
  display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
  padding: 0.6rem 0.85rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.78rem; font-weight: 500; color: var(--ink-soft);
}
.hv__bar > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hv__tag {
  flex: none;
  font-size: 0.68rem; color: var(--stone);
  border: 1px solid var(--line-strong); border-radius: 99px;
  padding: 0.02rem 0.5rem;
}
.hv__body { padding: 0.85rem; display: grid; gap: 0.75rem; }
.hv__tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.hv__tiles i { height: 2.4rem; border-radius: 4px; background: var(--sand); }
.hv__tiles i:first-child { background: var(--maroon-tint); }
.hv__chart {
  display: flex; align-items: flex-end; gap: 0.35rem;
  height: 4.6rem; border-bottom: 1px solid var(--line);
}
.hv__chart b {
  flex: 1; height: var(--h);
  background: var(--line-strong); border-radius: 2px 2px 0 0;
  transform-origin: bottom;
  animation: hv-grow 800ms var(--ease) both;
  animation-delay: calc(750ms + var(--i, 0) * 60ms);
}
.hv__chart b.is-hi { background: var(--fill); }
.hv__lines i { display: block; height: 0.45rem; width: var(--w); background: var(--sand); border-radius: 3px; }
.hv__lines i + i { margin-top: 0.45rem; }

.hv__flow { display: flex; align-items: center; padding-block: 0.4rem; }
.hv__node {
  flex: none; display: grid; place-items: center;
  width: 1.7rem; height: 1.7rem; border-radius: 50%;
  border: 2px solid var(--line-strong); background: var(--paper);
}
.hv__node svg { width: 0.8rem; height: 0.8rem; fill: none; stroke: var(--on-maroon); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hv__node.is-done { background: var(--fill); border-color: var(--fill); }
.hv__join { flex: 1; height: 2px; background: var(--line-strong); }
.hv__join.is-done { background: var(--fill); }

.hv__row { display: grid; grid-template-columns: 1.1rem 1fr 2.4rem; align-items: center; gap: 0.7rem; padding-block: 0.15rem; }
.hv__sq { width: 1.1rem; height: 1.1rem; border-radius: 3px; background: var(--sand); }
.hv__ln { height: 0.45rem; width: var(--w); background: var(--sand); border-radius: 3px; }
.hv__pill { height: 0.9rem; border-radius: 99px; background: var(--maroon-tint); }
.hv__row:first-child .hv__pill { background: var(--fill); opacity: 0.85; }

.hv__cap { margin-top: 1rem; font-size: var(--text-sm); color: var(--stone); max-width: 30rem; }

@keyframes hv-in { from { opacity: 0; transform: translateY(18px); } }
@keyframes hv-grow { from { transform: scaleY(0); } }
@media (prefers-reduced-motion: reduce) {
  .hv__card, .hv__chart b { animation: none; }
}

/* ==========================================================================
   Extras: icons, header tools, search palette, role finder, stage tracker,
   ruled tiles, ledger, footer, project cards view, print.
   Loaded last so it can refine anything earlier.
   ========================================================================== */

/* ---------- Icons ---------- */
.icon {
  width: 1.25rem; height: 1.25rem; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.ico {
  display: inline-grid; place-items: center;
  width: 2.6rem; height: 2.6rem; border-radius: 50%;
  background: var(--maroon-tint); color: var(--maroon);
}
.ico .icon { width: 1.3rem; height: 1.3rem; }

/* ---------- Header tools ---------- */
.site-nav__tools { display: flex; align-items: center; gap: 0.6rem; margin-top: 1.75rem; }
.tool-btn {
  display: inline-flex; align-items: center; gap: 0.6rem;
  min-height: 2.75rem; padding: 0 0.95rem;
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: transparent; color: var(--ink-soft);
  font-size: 0.92rem; cursor: pointer;
  transition: border-color 150ms, color 150ms, background-color 150ms;
}
.tool-btn:hover { border-color: var(--ink); color: var(--ink); }
.tool-btn__kbd {
  font: inherit; font-size: 0.72rem; line-height: 1;
  padding: 0.22rem 0.4rem; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--stone);
}
.tool-btn--icon { width: 2.75rem; padding: 0; justify-content: center; }
@media (min-width: 75em) {
  .site-nav { display: flex; align-items: center; }
  .site-nav__tools { margin: 0 0 0 0.6rem; padding-left: 0.6rem; border-left: 1px solid var(--line); gap: 0.15rem; }
  .tool-btn { min-height: 2.5rem; padding: 0 0.6rem; border-color: transparent; }
  .tool-btn:hover { border-color: var(--line-strong); }
  .tool-btn__label, .tool-btn__kbd { display: none; }
  .tool-btn--icon { width: 2.5rem; padding: 0; }
}

/* ---------- Search palette ---------- */
.palette {
  border: 0; padding: 0; background: transparent; color: var(--ink);
  width: min(40rem, calc(100vw - 1.5rem));
  max-height: none; overflow: visible;
  margin: clamp(2rem, 11vh, 7rem) auto auto;
}
.palette::backdrop { background: rgba(30, 14, 16, 0.5); backdrop-filter: blur(3px); }
.palette[open] { animation: palette-in 180ms var(--ease) both; }
@keyframes palette-in { from { opacity: 0; transform: translateY(-8px) scale(0.985); } }
.palette__box {
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: 0 32px 80px -24px rgba(0, 0, 0, 0.55);
  overflow: hidden;
  max-height: min(36rem, calc(100dvh - 4rem));
}
.palette__field { display: flex; align-items: center; gap: 0.8rem; padding: 0.95rem 1.1rem; border-bottom: 1px solid var(--line); color: var(--stone); }
.palette__field input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font-size: 1.1rem; color: var(--ink);
}
.palette__field input[type='search'],
.palette__field input[type='search']:focus {
  /* The field has its own focus underline; drop the generic input halo. */
  box-shadow: none; border: 0; border-radius: 0; padding: 0.2rem 0; background: transparent;
}
.palette__field input::-webkit-search-cancel-button { display: none; }
.palette__field:focus-within { box-shadow: inset 0 -2px 0 var(--fill); }
.palette__close {
  font: inherit; font-size: 0.75rem; padding: 0.25rem 0.5rem;
  border: 1px solid var(--line-strong); border-radius: 4px; background: transparent; color: var(--stone); cursor: pointer;
}
.palette__list { overflow-y: auto; padding: 0.4rem; overscroll-behavior: contain; }
.palette__group { padding: 0.8rem 0.8rem 0.3rem; font-size: 0.8rem; font-weight: 600; color: var(--stone); }
.palette__item { display: grid; gap: 0.1rem; padding: 0.6rem 0.8rem; border-radius: 5px; cursor: pointer; }
.palette__item.is-active { background: var(--maroon-tint); }
.palette__title { font-weight: 500; line-height: 1.35; }
.palette__hint { font-size: 0.85rem; color: var(--stone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette__empty { padding: 1.4rem 0.9rem; color: var(--stone); }
.palette__status { padding: 0.6rem 1.1rem; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--stone); }

/* ---------- Statements, ledger, chips ---------- */
.lead-text { font-size: var(--text-md); line-height: 1.55; color: var(--ink-soft); max-width: 34rem; }
.ledger { border-top: 1px solid var(--line-strong); }
.ledger li {
  position: relative;
  padding: 1.2rem 0 1.25rem 1.6rem;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-display);
  font-size: var(--text-lg); line-height: 1.38;
}
.ledger li::before { content: ''; position: absolute; left: 0; top: 1.15em; width: 0.5rem; height: 0.5rem; background: var(--ember); }
.value-cols__link { display: inline-block; margin-top: 1.5rem; }

.measure-chips { display: grid; gap: 0.6rem; align-content: start; }
@media (min-width: 40em) { .measure-chips { grid-template-columns: repeat(2, 1fr); } }
.measure-chips li {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.95rem 1.1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  font-weight: 500;
}
.measure-chips li::before {
  content: ''; flex: none; width: 0.7rem; height: 0.7rem; border-radius: 50%;
  border: 1.5px solid var(--maroon);   /* hollow: nothing reported yet */
}

/* ---------- Ruled tiles ---------- */
.tiles { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 40em) { .tiles { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 64em) {
  .tiles--3 { grid-template-columns: repeat(3, 1fr); }
  .tiles--4 { grid-template-columns: repeat(4, 1fr); }
}
/* Let the final tile fill its row, so a partly filled last row never shows an empty cell. */
@media (min-width: 40em) {
  .tiles > .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
}
@media (min-width: 64em) {
  .tiles--3 > .tile:last-child:nth-child(3n + 1) { grid-column: 1 / -1; }
  .tiles--3 > .tile:last-child:nth-child(3n + 2) { grid-column: span 2; }
  .tiles--4 > .tile:last-child:nth-child(4n + 1) { grid-column: 1 / -1; }
  .tiles--4 > .tile:last-child:nth-child(4n + 2) { grid-column: span 3; }
  .tiles--4 > .tile:last-child:nth-child(4n + 3) { grid-column: span 2; }
  .tiles--3 > .tile:last-child:nth-child(odd):not(:nth-child(3n + 1)):not(:nth-child(3n + 2)) { grid-column: auto; }
}
.tile { background: var(--paper); padding: 1.4rem 1.5rem 1.6rem; display: grid; gap: 0.4rem; align-content: start; }
.band--sand .tile { background: var(--sand); }
.band--sand .tiles { background: var(--line-strong); border-color: var(--line-strong); }
.tile__label { font-size: 0.85rem; color: var(--stone); }
.tile__title { font-family: var(--font-display); font-size: var(--text-lg); line-height: 1.28; font-weight: 400; }
.tile__note { font-size: 0.92rem; color: var(--stone); }
.tile--icon .ico { margin-bottom: 0.7rem; }
.tile--icon .tile__note { color: var(--ink-soft); }

/* ---------- Role finder ---------- */
.finder { display: grid; gap: 2rem; align-items: start; }
@media (min-width: 60em) { .finder { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 4rem; } }
.finder__choices { border: 0; padding: 0; margin: 0; display: grid; gap: 0.6rem; min-width: 0; }
.finder__legend { font-family: var(--font-display); font-size: var(--text-lg); margin-bottom: 0.9rem; padding: 0; }
.chip {
  display: flex; align-items: flex-start; gap: 0.85rem;
  padding: 0.9rem 1rem;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--surface); cursor: pointer;
  transition: border-color 150ms, background-color 150ms;
}
.chip:hover { border-color: var(--ink-soft); }
.chip input { margin-top: 0.28rem; width: 1.05rem; height: 1.05rem; accent-color: var(--fill); flex: none; }
.chip:has(input:checked) { border-color: var(--fill); background: var(--maroon-tint); }
.chip:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.finder__out {
  padding: 1.6rem 1.75rem;
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--fill); border-radius: var(--radius);
}
@media (min-width: 60em) { .finder__out { position: sticky; top: calc(var(--header-h) + 1.5rem); } }
.finder__title { font-family: var(--font-display); font-weight: 400; font-size: var(--text-xl); line-height: 1.2; margin-bottom: 0.9rem; }
.finder__roles { display: grid; gap: 0.9rem; margin-bottom: 1.5rem; }
.finder__roles li { display: grid; gap: 0.15rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--line); }
.finder__roles span { color: var(--ink-soft); font-size: 0.95rem; }

/* ---------- Project stage tracker ---------- */
.stages { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 0.5rem 0 1.4rem; }
.stages__item {
  position: relative; display: grid; justify-items: center; align-content: start; gap: 0.55rem;
  text-align: center; font-size: 0.8rem; line-height: 1.25; color: var(--stone);
}
.stages__item::before { content: ''; position: absolute; top: 0.52rem; left: -50%; right: 50%; height: 2px; background: var(--line-strong); }
.stages__item:first-child::before { display: none; }
.stages__item.is-done::before, .stages__item.is-current::before { background: var(--fill); }
.stages__dot {
  position: relative; z-index: 1;
  width: 1.1rem; height: 1.1rem; border-radius: 50%;
  border: 2px solid var(--line-strong); background: var(--paper);
}
.stages__item.is-done .stages__dot { background: var(--fill); border-color: var(--fill); }
.stages__item.is-current .stages__dot { border-color: var(--fill); box-shadow: 0 0 0 4px var(--maroon-tint); }
.stages__item.is-current { color: var(--ink); font-weight: 600; }
@media (min-width: 40em) { .stages__item { font-size: 0.9rem; } }

/* ---------- Projects: toolbar, view toggle, card view ---------- */
.filters { align-items: end; }
.field--view { min-width: 0; }
.field__label { display: block; font-size: 0.95rem; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button {
  display: inline-flex; align-items: center; gap: 0.45rem;
  min-height: 2.75rem; padding: 0 0.9rem;
  background: transparent; border: 0; cursor: pointer; color: var(--stone);
}
.seg button .icon { width: 1.05rem; height: 1.05rem; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed='true'] { background: var(--fill); color: var(--on-maroon); }
.seg button:focus-visible { outline-offset: -3px; }

.project-list.is-grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr)); border-top: 0; }
.project-list.is-grid .project-row {
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  transition: border-color 150ms, box-shadow 200ms var(--ease);
}
.project-list.is-grid .project-row:hover { border-color: var(--maroon); box-shadow: var(--shadow-lift); }
.project-list.is-grid .project-row__link { display: flex; flex-direction: column; align-items: flex-start; gap: 0.55rem; padding: 1.4rem; height: 100%; }
.project-list.is-grid .project-row__meta { margin-top: auto; padding-top: 0.6rem; flex-direction: row; }
.project-list.is-grid .project-row__arrow { display: none; }
.project-list.is-grid .project-row__link:focus-visible { outline-offset: 2px; }

/* ---------- Project page ---------- */
.share { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: 1.4rem; }
.btn--small { min-height: 2.5rem; padding: 0 0.85rem; font-size: 0.9rem; gap: 0.5rem; }
.btn .icon { width: 1.05rem; height: 1.05rem; }
.share__note { flex-basis: 100%; min-height: 1.4em; font-size: var(--text-sm); color: var(--stone); }
.band--compact { padding-block: clamp(2.5rem, 2rem + 3vw, 4.5rem); }
.band--compact .minor-title { margin-bottom: 1rem; }

/* ---------- Contact ---------- */
.contact__map { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
.contact__map .icon { width: 1.05rem; height: 1.05rem; }

/* ---------- Dark bands: texture and sign-off ---------- */
.band--grid { position: relative; isolation: isolate; overflow: hidden; }
.band--grid::before {
  content: ''; position: absolute; inset: 0; z-index: -1;
  background-image:
    linear-gradient(rgba(248, 241, 234, 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(248, 241, 234, 0.07) 1px, transparent 1px);
  background-size: 2.5rem 2.5rem;
  -webkit-mask-image: radial-gradient(ellipse 80% 100% at 100% 0%, #000 10%, transparent 70%);
  mask-image: radial-gradient(ellipse 80% 100% at 100% 0%, #000 10%, transparent 70%);
}
.sign-off {
  margin-top: 1.4rem;
  font-family: var(--font-display); font-style: italic;
  font-size: var(--text-lg); color: var(--on-maroon-soft);
}
.sign-off::before { content: ''; display: inline-block; width: 1.75rem; height: 2px; margin-right: 0.8rem; vertical-align: middle; background: var(--ember); }
.sign-off + .join-title { margin-top: clamp(2.5rem, 5vw, 4rem); }
.sign-off + .ink-actions { margin-top: 2rem; }

/* ---------- Footer ---------- */
.site-footer__inner { gap: 2.5rem 3rem; }
@media (min-width: 56em) {
  .site-footer__inner { grid-template-columns: 1.5fr 1fr 1fr; }
}
.site-footer__heading { font-size: 0.85rem; font-weight: 600; color: var(--stone); margin-bottom: 1rem; }
.site-footer__nav ul { grid-template-columns: 1fr; gap: 0.6rem; }
.site-footer__work ul { display: grid; gap: 0.6rem; }
.site-footer__work a, .site-footer__parent a { text-decoration: none; color: var(--ink-soft); font-size: 0.95rem; }
.site-footer__work a:hover, .site-footer__parent a:hover { color: var(--maroon); text-decoration: underline; text-underline-offset: 0.25em; }
.site-footer__parent { margin-top: 1.4rem; }
.site-footer__parent a { display: inline-flex; align-items: center; gap: 0.4rem; }
.site-footer__parent .icon { width: 0.95rem; height: 0.95rem; }
.site-footer__map { display: inline-block; margin-top: 0.9rem; }
.site-footer__legal { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 2rem; }
.site-footer__motto { font-family: var(--font-display); font-style: italic; font-size: 1rem; color: var(--ink-soft); }
.site-footer__motto::before { content: ''; display: inline-block; width: 0.5rem; height: 0.5rem; margin-right: 0.6rem; background: var(--ember); }

/* ---------- Print ---------- */
@media print {
  .site-header, .site-footer, .skip-link, .palette, .share, .pager, .hv, .menu-toggle, body::before { display: none !important; }
  :root { color-scheme: light; --paper: #fff; --surface: #fff; --sand: #fff; --ink: #000; --ink-soft: #222; --stone: #444; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .band, .band--sand, .band--ink { background: #fff !important; color: #000 !important; padding-block: 1.2rem; }
  .band--grid::before, .hero::before { display: none; }
  .project-row__link, a { color: inherit; text-decoration: none; }
  a[href^='http']::after { content: ' (' attr(href) ')'; font-size: 9pt; color: #444; }
}
</style>

/**
 * Tiny, dependency-free templating helpers.
 * `html` escapes every interpolated value unless it is already SafeHtml,
 * so content files can never inject markup by accident.
 */
class SafeHtml {
  constructor(value) { this.value = value; }
  toString() { return this.value; }
}

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ESCAPES[c]);
}

function raw(value) {
  return new SafeHtml(String(value));
}

function renderValue(value) {
  if (value === null || value === undefined || value === false) return '';
  if (Array.isArray(value)) return value.map(renderValue).join('');
  if (value instanceof SafeHtml) return value.value;
  return escapeHtml(value);
}

function html(strings, ...values) {
  let out = '';
  strings.forEach((chunk, i) => {
    out += chunk;
    if (i < values.length) out += renderValue(values[i]);
  });
  return new SafeHtml(out);
}

/** Build a hash-route href: link('/projects/x', { topic: 'y' }) -> '#/projects/x?topic=y' */
function link(path, params) {
  const qs = params ? new URLSearchParams(params).toString() : '';
  return `#${path}${qs ? `?${qs}` : ''}`;
}

function getProject(slug) {
  return PROJECTS.find((p) => p.slug === slug) || null;
}

function getAdjacentProjects(slug) {
  const i = PROJECTS.findIndex((p) => p.slug === slug);
  if (i === -1) return { prev: null, next: null };
  return {
    prev: i > 0 ? PROJECTS[i - 1] : null,
    next: i < PROJECTS.length - 1 ? PROJECTS[i + 1] : null,
  };
}

function statusesInUse() {
  const used = new Set(PROJECTS.map((p) => p.status));
  return STATUS_ORDER.filter((s) => used.has(s));
}

function Logo({ className = '' } = {}) {
  const { logo, logoReversed, logoWidth, logoHeight } = SITE.assets;
  const alt = `${SITE.institution}, ${SITE.institutionNote}`;
  return html`<span class="logo ${className}">
    <img class="logo__img logo__img--light" src="${logo}" alt="${alt}" width="${logoWidth}" height="${logoHeight}" decoding="async">
    <img class="logo__img logo__img--dark" src="${logoReversed}" alt="${alt}" width="${logoWidth}" height="${logoHeight}" decoding="async">
  </span>`;
}

/* ---------- Page scaffolding ---------- */

/** Top of every inner page. `crumbs`: [{ label, path }] */
function PageHeader({ title, lede, crumbs = [], aside = null }) {
  return html`<header class="page-header">
    <div class="wrap page-header__inner">
      ${crumbs.length
        ? html`<nav class="crumbs" aria-label="Breadcrumb"><ol>
            ${crumbs.map((c) => html`<li><a href="${link(c.path)}">${c.label}</a></li>`)}
          </ol></nav>`
        : ''}
      <h1 class="page-header__title" tabindex="-1">${title}</h1>
      ${lede ? html`<p class="page-header__lede">${lede}</p>` : ''}
      ${aside || ''}
    </div>
  </header>`;
}

function SectionHeading({ title, intro, id, level = 2 }) {
  const tag = `h${level}`;
  return html`<div class="section-heading">
    <${tag} class="section-heading__title" ${id ? html`id="${id}"` : ''}>${title}</${tag}>
    ${intro ? html`<p class="section-heading__intro">${intro}</p>` : ''}
  </div>`;
}

/* ---------- Content blocks ---------- */

function StatusBadge(status) {
  const s = PROJECT_STATUS[status] || { label: status };
  return html`<span class="status status--${status}">${s.label}</span>`;
}

function focusAreaTitle(id) {
  const fa = FOCUS_AREAS.find((f) => f.id === id);
  return fa ? fa.title : '';
}

function objectiveText(id) {
  const o = OBJECTIVES.find((x) => x.id === id);
  return o ? o.text : '';
}

/** A project as a row in a list. Used on Home, Focus areas and Projects. */
function ProjectRow(project, { headingLevel = 3 } = {}) {
  const tag = `h${headingLevel}`;
  const searchText = `${project.title} ${project.summary}`.toLowerCase();
  return html`<li class="project-row" data-slug="${project.slug}" data-status="${project.status}" data-area="${project.focusArea}" data-text="${searchText}">
    <a class="project-row__link" href="${link(`/projects/${project.slug}`)}">
      <${tag} class="project-row__title">${project.title}</${tag}>
      <p class="project-row__summary">${project.summary}</p>
      <span class="project-row__meta">
        ${StatusBadge(project.status)}
        <span class="project-row__area">${focusAreaTitle(project.focusArea)}</span>
      </span>
      <span class="project-row__arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </li>`;
}

function Quote({ text, cite }) {
  return html`<figure class="quote">
    <blockquote><p>${text}</p></blockquote>
    ${cite ? html`<figcaption>${cite}</figcaption>` : ''}
  </figure>`;
}

/** Three routes into CAPRO, grounded in the mission statements. */
function Audiences({ headingLevel = 3 } = {}) {
  const tag = `h${headingLevel}`;
  return html`<ul class="audiences">
    ${AUDIENCES.map((a) => html`<li class="audience">
      <${tag} class="audience__title">${a.title}</${tag}>
      <p class="audience__text">${a.text}</p>
      <a class="text-link" href="${link('/contact', { topic: a.id })}">${a.action}</a>
    </li>`)}
  </ul>`;
}

function Button({ href, label, variant = 'primary' }) {
  return html`<a class="btn btn--${variant}" href="${href}">${label}</a>`;
}

/** Mobile menu behaviour. Returns a function that closes the menu. */
function bindMenu(headerEl) {
  const toggle = headerEl.querySelector('.menu-toggle');
  const nav = headerEl.querySelector('.site-nav');
  const setOpen = (open) => {
    toggle.setAttribute('aria-expanded', String(open));
    headerEl.classList.toggle('is-open', open);
    document.body.classList.toggle('menu-open', open);
  };
  toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-expanded') !== 'true'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && headerEl.classList.contains('is-open')) {
      setOpen(false);
      toggle.focus();
    }
  });
  nav.addEventListener('click', (e) => {
    if (e.target.closest('a') || e.target.closest('[data-open-search]')) setOpen(false);
  });
  const mq = window.matchMedia('(min-width: 75em)');
  mq.addEventListener('change', () => setOpen(false));
  return () => setOpen(false);
}

function markCurrentNav(headerEl, path) {
  const section = '/' + (path.split('/')[1] || '');
  headerEl.querySelectorAll('.site-nav__link').forEach((a) => {
    const target = a.dataset.path;
    const current = target === '/' ? path === '/' : section === target;
    if (current) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}

function currentTheme() {
  const set = document.documentElement.dataset.theme;
  if (set === 'light' || set === 'dark') return set;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/** Light/dark switch. Follows the system until the visitor chooses. */
function bindTheme(headerEl) {
  const btn = headerEl.querySelector('[data-theme-toggle]');
  const sync = () => {
    const dark = currentTheme() === 'dark';
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    btn.innerHTML = String(Icon(dark ? 'sun' : 'moon'));
  };
  btn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch { /* storage unavailable */ }
    sync();
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync);
  sync();
}

/**
 * Site search. Open with Ctrl/⌘ + K, "/" or the header button.
 * The index is built from the same content files that render the pages,
 * so a new project or role is searchable the moment it is added.
 */

const PAGE_HINTS = {
  '/': 'Vision, objectives and the product studio',
  '/about': 'Vision, mission, objectives, stack and success measures',
  '/focus-areas': 'Internal software solutions and student engagement',
  '/projects': 'Every CAPRO project, with search and filters',
  '/students': 'Roles, benefits and the role finder',
  '/contact': 'Suggest a process, discuss a use-case or join a team',
};

function buildSearchIndex() {
  const items = [];
  const add = (group, title, hint, href, extra = '') =>
    items.push({ group, title, hint, href, hay: `${title} ${hint} ${extra}`.toLowerCase() });

  NAV.forEach((n) => add('Pages', n.label, PAGE_HINTS[n.path] || '', link(n.path)));
  FOCUS_AREAS.forEach((f) => add('Focus areas', f.title, f.summary, link('/focus-areas', { section: f.anchor })));
  PROJECTS.forEach((p) => add('Projects', p.title, p.summary, link(`/projects/${p.slug}`), (PROJECT_STATUS[p.status] || {}).label || ''));
  ROLES.forEach((r) => add('Student roles', r.name, r.does, link('/students', { role: r.id, section: 'students-roles' })));
  OBJECTIVES.forEach((o) => add('Objectives', o.text, 'Core objective', link('/about', { section: 'about-objectives' }), 'goals core objectives'));
  INSTITUTE_BENEFITS.forEach((b) => add('Benefits', b, 'Benefit to the institute', link('/about', { section: 'about-benefits' }), 'benefits institute'));
  STUDENT_BENEFITS.forEach((b) => add('Benefits', b.title, b.text, link('/students', { section: 'students-gain' }), 'benefits students'));
  TECH_STACK.forEach((t) => add('Technology', t.items, t.area, link('/about', { section: 'about-stack' }), 'technology stack tools'));
  SUCCESS_MEASURES.forEach((m) => add('Success measures', m, 'Success measure', link('/about', { section: 'about-measures' }), 'success metrics measures'));
  return items;
}

const GROUP_ORDER = ['Pages', 'Projects', 'Focus areas', 'Student roles', 'Objectives', 'Benefits', 'Technology', 'Success measures'];

function searchItems(items, query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    return items.filter((i) => i.group === 'Pages' || i.group === 'Focus areas' || i.group === 'Projects').slice(0, 14);
  }
  const tokens = q.split(/\s+/);
  return items
    .map((i) => {
      if (!tokens.every((t) => i.hay.includes(t))) return null;
      const title = i.title.toLowerCase();
      let score = 0;
      tokens.forEach((t) => {
        if (title.startsWith(t)) score += 4;
        else if (title.includes(t)) score += 2;
        else score += 1;
      });
      return { ...i, score };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score || GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group))
    .slice(0, 24);
}

function paletteMarkup() {
  return html`<form class="palette__box" role="search" method="dialog" data-palette-form>
    <div class="palette__field">
      ${Icon('search')}
      <label class="visually-hidden" for="palette-input">Search CAPRO</label>
      <input id="palette-input" type="search" role="combobox" aria-expanded="true" aria-controls="palette-list"
        aria-autocomplete="list" placeholder="Search the site" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <button class="palette__close" type="button" data-palette-close aria-label="Close search">Esc</button>
    </div>
    <ul class="palette__list" id="palette-list" role="listbox" aria-label="Results"></ul>
    <p class="palette__status" aria-live="polite" data-palette-status></p>
  </form>`;
}

function mountPalette(headerEl) {
  const dialog = document.createElement('dialog');
  dialog.className = 'palette';
  dialog.setAttribute('aria-label', 'Search CAPRO');
  dialog.innerHTML = String(paletteMarkup());
  document.body.appendChild(dialog);

  const input = dialog.querySelector('#palette-input');
  const list = dialog.querySelector('#palette-list');
  const status = dialog.querySelector('[data-palette-status]');
  const index = buildSearchIndex();
  let results = [];
  let active = 0;

  const setActive = (i, scroll = true) => {
    active = results.length ? (i + results.length) % results.length : 0;
    list.querySelectorAll('[role="option"]').forEach((el, n) => {
      const on = n === active;
      el.classList.toggle('is-active', on);
      el.setAttribute('aria-selected', String(on));
      if (on) {
        input.setAttribute('aria-activedescendant', el.id);
        if (scroll) el.scrollIntoView({ block: 'nearest' });
      }
    });
    if (!results.length) input.removeAttribute('aria-activedescendant');
  };

  const render = () => {
    results = searchItems(index, input.value);
    let lastGroup = '';
    let n = 0;
    const parts = results.map((r) => {
      const head = r.group !== lastGroup
        ? html`<li class="palette__group" role="presentation">${r.group}</li>` : '';
      lastGroup = r.group;
      const id = `palette-opt-${n++}`;
      return html`${head}<li class="palette__item" role="option" id="${id}" aria-selected="false" data-href="${r.href}">
        <span class="palette__title">${r.title}</span>${r.hint ? html`<span class="palette__hint">${r.hint}</span>` : ''}
      </li>`;
    });
    list.innerHTML = results.length
      ? parts.map(String).join('')
      : String(html`<li class="palette__empty" role="presentation">No results for “${input.value.trim()}”. Try a project name, a role such as design, or a word like dashboard.</li>`);
    status.textContent = results.length
      ? `${results.length} result${results.length === 1 ? '' : 's'}. Use the arrow keys, then Enter.`
      : 'No results.';
    setActive(0, false);
  };

  const go = (href) => {
    dialog.close();
    if (href) window.location.hash = href.replace(/^#/, '');
  };

  const open = () => {
    if (dialog.open) return;
    input.value = '';
    dialog.showModal();
    render();
    input.focus();
  };

  input.addEventListener('input', render);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Home' && results.length) { e.preventDefault(); setActive(0); }
    else if (e.key === 'End' && results.length) { e.preventDefault(); setActive(results.length - 1); }
    else if (e.key === 'Escape') {
      // Browsers clear a search field on Esc before anything else; close in one press instead.
      e.preventDefault();
      dialog.close();
    }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (results[active]) go(results[active].href);
    }
  });
  list.addEventListener('click', (e) => {
    const item = e.target.closest('[role="option"]');
    if (item) go(item.dataset.href);
  });
  list.addEventListener('mousemove', (e) => {
    const item = e.target.closest('[role="option"]');
    if (!item) return;
    const n = [...list.querySelectorAll('[role="option"]')].indexOf(item);
    if (n !== active) setActive(n, false);
  });
  dialog.querySelector('[data-palette-close]').addEventListener('click', () => dialog.close());
  dialog.querySelector('[data-palette-form]').addEventListener('submit', (e) => e.preventDefault());
  dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });

  headerEl.querySelectorAll('[data-open-search]').forEach((b) => b.addEventListener('click', open));

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'k') { e.preventDefault(); open(); return; }
    if (k === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const t = e.target;
      const typing = t instanceof HTMLElement && (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName));
      if (!typing && !dialog.open) { e.preventDefault(); open(); }
    }
  });

  // Show the platform's modifier key on the button.
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  headerEl.querySelectorAll('.tool-btn__kbd').forEach((el) => { el.textContent = mac ? '⌘ K' : 'Ctrl K'; });
}

/**
 * The six student roles from the CAPRO deck, drawn as one product
 * life cycle running from a need to a working digital solution.
 * Accessible tabs: arrow keys move between roles, Home/End jump.
 */
function StudioLine({ idPrefix = 'studio', start = 'Institutional or industry need', end = 'Digital solution' } = {}) {
  const first = ROLES[0];
  return html`<div class="studio" data-studio>
    <div class="studio__rail">
      <span class="studio__end studio__end--start">${start}</span>
      <div class="studio__track">
        <span class="studio__line" aria-hidden="true"></span>
        <div class="studio__stations" role="tablist" aria-label="Roles in a CAPRO product team">
          ${ROLES.map((r, i) => html`<button class="studio__station" type="button" role="tab"
              id="${idPrefix}-tab-${r.id}" aria-controls="${idPrefix}-panel"
              aria-selected="${i === 0 ? 'true' : 'false'}" tabindex="${i === 0 ? '0' : '-1'}"
              data-role="${r.id}" style="--i:${i}">
              <span class="studio__dot" aria-hidden="true"></span>
              <span class="studio__num" aria-hidden="true">${i + 1}</span>
              <span class="studio__role">${r.name}</span>
            </button>`)}
        </div>
      </div>
      <span class="studio__end studio__end--finish">${end}</span>
    </div>
    <div class="studio__panel" id="${idPrefix}-panel" role="tabpanel" aria-labelledby="${idPrefix}-tab-${first.id}" tabindex="0">
      <p class="studio__panel-step">Role <span data-step>1</span> of ${ROLES.length}</p>
      <h3 class="studio__panel-title" data-title>${first.name}</h3>
      <p class="studio__panel-text" data-text>${first.does}</p>
    </div>
  </div>`;
}

function mountStudioLine(root) {
  root.querySelectorAll('[data-studio]').forEach((el) => {
    const tabs = [...el.querySelectorAll('[role="tab"]')];
    const panel = el.querySelector('[role="tabpanel"]');
    const select = (tab, focus = false) => {
      const role = ROLES.find((r) => r.id === tab.dataset.role);
      tabs.forEach((t) => {
        const on = t === tab;
        t.setAttribute('aria-selected', String(on));
        t.tabIndex = on ? 0 : -1;
      });
      panel.setAttribute('aria-labelledby', tab.id);
      panel.querySelector('[data-step]').textContent = String(tabs.indexOf(tab) + 1);
      panel.querySelector('[data-title]').textContent = role.name;
      panel.querySelector('[data-text]').textContent = role.does;
      el.style.setProperty('--active', String(tabs.indexOf(tab)));
      panel.classList.remove('is-changing');
      void panel.offsetWidth; // restart the short swap transition
      panel.classList.add('is-changing');
      if (focus) tab.focus();
    };
    tabs.forEach((tab) => tab.addEventListener('click', () => select(tab)));
    el.querySelector('[role="tablist"]').addEventListener('keydown', (e) => {
      const i = tabs.indexOf(document.activeElement);
      if (i === -1) return;
      const keys = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: tabs.length - 1 };
      if (!(e.key in keys)) return;
      e.preventDefault();
      const next = (keys[e.key] + tabs.length) % tabs.length;
      select(tabs[next], true);
    });
    el.style.setProperty('--active', '0');
    // Deep link: #/students?role=design opens that role.
    const wanted = new URLSearchParams((window.location.hash.split('?')[1]) || '').get('role');
    const wantedTab = wanted && tabs.find((t) => t.dataset.role === wanted);
    if (wantedTab) select(wantedTab);
    // One orchestrated entrance: the line draws once, when the track is a quarter
    // of the way up the viewport or has already been scrolled past (End key,
    // anchor jump). A position check cannot be skipped the way an observer can.
    const reveal = () => {
      if (el.getBoundingClientRect().top < window.innerHeight * 0.75) {
        el.classList.add('is-drawn');
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('resize', onScroll);
        window.removeEventListener('hashchange', onScroll);
        return true;
      }
      return false;
    };
    let queued = false;
    const onScroll = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; reveal(); });
    };
    if (!reveal()) {
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      window.addEventListener('hashchange', onScroll);
    }
  });
}

function mountFilters(root) {
  const form = root.querySelector('[data-filters]');
  const count = root.querySelector('[data-count]');
  const empty = root.querySelector('[data-empty]');
  const list = root.querySelector('[data-list]');
  const rows = [...list.querySelectorAll(':scope > .project-row')];
  const original = rows.slice();
  const viewBtns = [...root.querySelectorAll('[data-view]')];
  let view = 'list';

  const titleOf = (row) => row.querySelector('.project-row__title').textContent.trim();

  const setView = (v) => {
    view = v === 'grid' ? 'grid' : 'list';
    list.classList.toggle('is-grid', view === 'grid');
    viewBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  };

  // Restore state from the address, so a filtered view can be shared.
  const startParams = new URLSearchParams((window.location.hash.split('?')[1]) || '');
  ['status', 'area', 'sort'].forEach((name) => {
    const v = startParams.get(name);
    if (v && form[name] && [...form[name].options].some((o) => o.value === v)) form[name].value = v;
  });
  setView(startParams.get('view'));

  const syncUrl = () => {
    const p = new URLSearchParams();
    if (form.q.value.trim()) p.set('q', form.q.value.trim());
    ['status', 'area', 'sort'].forEach((n) => { if (form[n] && form[n].value) p.set(n, form[n].value); });
    if (view === 'grid') p.set('view', 'grid');
    const qs = p.toString();
    // replaceState does not fire hashchange, so the page is not re-rendered.
    history.replaceState(null, '', `#/projects${qs ? `?${qs}` : ''}`);
  };

  const order = () => {
    const mode = form.sort.value;
    let sorted = original.slice();
    if (mode === 'az') sorted.sort((a, b) => titleOf(a).localeCompare(titleOf(b), 'en'));
    if (mode === 'status') {
      sorted.sort((a, b) => STATUS_ORDER.indexOf(a.dataset.status) - STATUS_ORDER.indexOf(b.dataset.status));
    }
    sorted.forEach((r) => list.appendChild(r));
  };

  const apply = () => {
    const q = (form.q.value || '').trim().toLowerCase();
    const status = form.status ? form.status.value : '';
    const area = form.area ? form.area.value : '';
    let shown = 0;
    rows.forEach((row) => {
      const match = (!q || row.dataset.text.includes(q))
        && (!status || row.dataset.status === status)
        && (!area || row.dataset.area === area);
      row.hidden = !match;
      if (match) shown += 1;
    });
    order();
    count.textContent = shown === rows.length
      ? `${rows.length} projects`
      : `Showing ${shown} of ${rows.length} projects`;
    empty.hidden = shown !== 0;
    syncUrl();
  };

  form.addEventListener('input', apply);
  form.addEventListener('submit', (e) => e.preventDefault());
  viewBtns.forEach((b) => b.addEventListener('click', () => { setView(b.dataset.view); syncUrl(); }));
  root.querySelector('[data-reset]').addEventListener('click', () => {
    form.reset();
    form.q.value = '';
    apply();
    form.q.focus();
  });
  apply();
}

/** Where a project is on its path from first idea to a product in use. */
function StageTracker(status) {
  const stages = [...STATUS_ORDER].reverse(); // planned -> live
  const at = stages.indexOf(status);
  return html`<ol class="stages" aria-label="Project stages">
    ${stages.map((s, i) => html`<li class="stages__item${i < at ? ' is-done' : ''}${i === at ? ' is-current' : ''}" ${i === at ? html`aria-current="step"` : ''}>
      <span class="stages__dot" aria-hidden="true"></span>
      <span class="stages__label">${PROJECT_STATUS[s].label}${i < at ? html`<span class="visually-hidden"> (complete)</span>` : ''}</span>
    </li>`)}
  </ol>`;
}
