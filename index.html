const dateFmt = new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

function formatDate(iso) {
  const d = new Date(`${iso}T00:00:00`);
  return Number.isNaN(d.getTime()) ? iso : dateFmt.format(d);
}

/** Optional sections render only when the project has that data. */
function ProseSection(title, text) {
  if (!text) return '';
  return html`<section class="detail-section"><h2>${title}</h2><p>${text}</p></section>`;
}

function ProjectPage({ params: _params, match }) {
  const project = getProject(match[1]);
  if (!project) return NotFoundPage({ message: 'There is no CAPRO project at this address. It may have been renamed.' });

  const status = PROJECT_STATUS[project.status] || { label: project.status, note: '' };
  const area = FOCUS_AREAS.find((f) => f.id === project.focusArea);
  const { prev, next } = getAdjacentProjects(project.slug);
  const objectives = (project.objectives || []).map(objectiveText).filter(Boolean);

  const facts = html`<dl class="facts">
    <div class="facts__row"><dt>Status</dt><dd>${StatusBadge(project.status)}</dd></div>
    <div class="facts__row"><dt>Focus area</dt><dd>${area
      ? html`<a href="${link('/focus-areas', { section: area.anchor })}">${focusAreaTitle(project.focusArea)}</a>`
      : focusAreaTitle(project.focusArea)}</dd></div>
    ${project.users && project.users.length ? html`<div class="facts__row"><dt>Built for</dt><dd>${project.users.join(', ')}</dd></div>` : ''}
    ${project.stack && project.stack.length ? html`<div class="facts__row"><dt>Stack</dt><dd>${project.stack.join(', ')}</dd></div>` : ''}
  </dl>
  <div class="share">
    <button type="button" class="btn btn--quiet btn--small" data-copy-link>${Icon('link')}<span>Copy link</span></button>
    <button type="button" class="btn btn--quiet btn--small" data-print>${Icon('print')}<span>Print</span></button>
    <p class="share__note" aria-live="polite" data-share-note></p>
  </div>`;

  const related = PROJECTS.filter((p) => p.focusArea === project.focusArea && p.slug !== project.slug).slice(0, 3);

  const body = html`
  ${PageHeader({
    crumbs: [{ label: 'Home', path: '/' }, { label: 'Projects', path: '/projects' }],
    title: project.title,
    lede: project.summary,
  })}

  <div class="band band--tight">
    <div class="wrap detail">
      <aside class="detail__aside" aria-label="Project facts">${facts}</aside>

      <div class="detail__main">
        <section class="detail-section">
          <h2>Where it stands</h2>
          ${StageTracker(project.status)}
          <p>${status.note}</p>
        </section>

        ${ProseSection('The problem', project.problem)}
        ${ProseSection('What we’re building', project.approach)}

        ${objectives.length ? html`<section class="detail-section">
          <h2>Why CAPRO is building it</h2>
          <ul class="plain-list">${objectives.map((o) => html`<li>${o}</li>`)}</ul>
        </section>` : ''}

        <section class="detail-section">
          <h2>Team</h2>
          ${project.team && project.team.length
            ? html`<ul class="team-list">${project.team.map((m) => html`<li><span class="team-list__name">${m.name}</span><span class="team-list__role">${m.role}</span></li>`)}</ul>`
            : html`<p>The team for this project will be listed here once it is formed. CAPRO teams are drawn from students across these roles:</p>
              <ul class="plain-list plain-list--links">${ROLES.map((r) => html`<li><a href="${link('/students')}">${r.name}</a></li>`)}</ul>`}
        </section>

        ${project.milestones && project.milestones.length ? html`<section class="detail-section">
          <h2>Progress</h2>
          <ol class="timeline">${project.milestones.map((m) => html`<li class="timeline__item">
            <time datetime="${m.date}">${formatDate(m.date)}</time>
            <p class="timeline__title">${m.title}</p>
            ${m.note ? html`<p class="timeline__note">${m.note}</p>` : ''}
          </li>`)}</ol>
        </section>` : ''}

        ${project.links && project.links.length ? html`<section class="detail-section">
          <h2>Links</h2>
          <ul class="plain-list">${project.links.map((l) => html`<li><a href="${l.href}" rel="noopener">${l.label}</a></li>`)}</ul>
        </section>` : ''}

        <section class="detail-callout">
          <h2>Work with this project</h2>
          <p>If you would use this product, or have context that would help shape it, the team would like to hear from you.</p>
          <a class="btn btn--primary" href="${link('/contact', { topic: 'department', project: project.slug })}">Get in touch about this project</a>

    </div>
  </section>` : ''}

  <nav class="pager wrap" aria-label="More projects">

  return {
    title: project.title,
    description: `${project.title}: ${project.summary} A ${SITE.shortName} project at ${SITE.institution}.`,
    body,
    mount: mountProjectPage,
  };
}

function mountProjectPage(root) {
  const note = root.querySelector('[data-share-note]');
  const say = (text) => { note.textContent = text; setTimeout(() => { note.textContent = ''; }, 2600); };
  root.querySelector('[data-copy-link]').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      say('Link copied.');
    } catch {
      say('Copy the address from your browser’s address bar.');
    }
  });
  root.querySelector('[data-print]').addEventListener('click', () => window.print());
}

/**
 * "What do you enjoy?" -> the CAPRO roles that line up with it.
 * A way to explore, not an assessment: every role in the deck is described
 * the same way and the result simply carries the choice into the enquiry form.
 */
const FINDER_PROMPTS = [
  { id: 'design', text: 'Sketching screens and working out how people will use something' },
  { id: 'product', text: 'Organising people, plans and priorities' },
  { id: 'engineering', text: 'Building features and working with data' },
  { id: 'qa', text: 'Finding what breaks and checking that things work' },
  { id: 'devops', text: 'Automating tasks and keeping systems running' },
  { id: 'writing', text: 'Explaining things clearly in writing' },
];

function RoleFinder() {
  return html`<div class="finder" data-finder>
    <fieldset class="finder__choices">
      <legend class="finder__legend">I enjoy…</legend>
      ${FINDER_PROMPTS.map((p) => html`<label class="chip"><input type="checkbox" name="enjoy" value="${p.id}"><span>${p.text}</span></label>`)}
    </fieldset>
    <div class="finder__out" aria-live="polite" data-finder-out></div>
  </div>`;
}

function mountRoleFinder(root) {
  root.querySelectorAll('[data-finder]').forEach((el) => {
    const out = el.querySelector('[data-finder-out]');
    const boxes = [...el.querySelectorAll('input[name="enjoy"]')];

    const paint = () => {
      const chosen = boxes.filter((b) => b.checked).map((b) => ROLES.find((r) => r.id === b.value)).filter(Boolean);
      if (!chosen.length) {
        out.innerHTML = String(html`<h3 class="finder__title">Your roles will appear here</h3>
          <p>Choose anything that sounds like you. Every role in a CAPRO product team is open to explore, and you can pick more than one.</p>`);
        return;
      }
      const ids = chosen.map((r) => r.id).join(',');
      out.innerHTML = String(html`<h3 class="finder__title">${chosen.length === 1 ? 'A role to explore' : `${chosen.length} roles to explore`}</h3>
        <ul class="finder__roles">${chosen.map((r) => html`<li><strong>${r.name}</strong><span>${r.does}</span></li>`)}</ul>
        <a class="btn btn--primary" href="${link('/contact', { topic: 'student', roles: ids })}">Express interest in ${chosen.length === 1 ? 'this role' : 'these roles'}</a>`);
    };

    el.addEventListener('change', paint);
    paint();
  });
}

function validate(form) {
  const errors = {};
  const v = (n) => (form[n] ? form[n].value.trim() : '');
  if (!v('topic')) errors.topic = 'Choose who you are getting in touch as.';
  if (!v('name')) errors.name = 'Enter your name.';
  if (!v('email')) errors.email = 'Enter your email address.';
  else if (!EMAIL_RE.test(v('email'))) errors.email = 'Enter an email address in the format name@example.com.';
  if (v('message').length < 20) errors.message = 'Write at least 20 characters so the team understands your request.';
  return errors;
}

function collect(form) {
  const data = new FormData(form);
  const topic = AUDIENCES.find((a) => a.id === data.get('topic'));
  return {
    topic: data.get('topic'),
    topic_label: topic ? topic.title : '',
    name: String(data.get('name') || '').trim(),
    email: String(data.get('email') || '').trim(),
    organisation: String(data.get('organisation') || '').trim() || null,
    roles: data.getAll('roles'),
    project: (getProject(String(data.get('project') || '')) || {}).title || null,
    message: String(data.get('message') || '').trim(),
  };
}

function composeText(e) {
  return [
    `From: ${e.name} <${e.email}>`,
    `Getting in touch as: ${e.topic_label}`,
    e.organisation ? `Department / organisation: ${e.organisation}` : null,
    e.project ? `Project: ${e.project}` : null,
    e.roles.length ? `Roles of interest: ${e.roles.join(', ')}` : null,
    '',
    e.message,
  ].filter((l) => l !== null).join('\n');
}

async function deliver(entry) {
  const { email, supabase } = SITE.contact;
  if (supabase && supabase.url && supabase.anonKey) {
    const res = await fetch(`${supabase.url.replace(/\/$/, '')}/rest/v1/${supabase.table}`, {
      method: 'POST',
      headers: {
        apikey: supabase.anonKey,
        Authorization: `Bearer ${supabase.anonKey}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal',
      },
      body: JSON.stringify(entry),
    });
    if (!res.ok) throw new Error(`Request failed with status ${res.status}`);
    return 'sent';
  }
  if (email) {
    const subject = `CAPRO enquiry: ${entry.topic_label}${entry.project ? ` (${entry.project})` : ''}`;
    window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(composeText(entry))}`;
    return 'mail';
  }
  return 'prepared';
}

const DRAFT_KEY = 'capro-contact-draft';
const DRAFT_FIELDS = ['topic', 'name', 'email', 'organisation', 'message'];

function readDraft() {
  try { return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null') || {}; } catch { return {}; }
}
function writeDraft(form) {
  const draft = {};
  DRAFT_FIELDS.forEach((n) => { if (form[n] && form[n].value) draft[n] = form[n].value; });
  try {
    if (Object.keys(draft).length) sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    else sessionStorage.removeItem(DRAFT_KEY);
  } catch { /* storage unavailable */ }
}
function clearDraft() {
  try { sessionStorage.removeItem(DRAFT_KEY); } catch { /* storage unavailable */ }
}

function mountContactForm(root) {
  const form = root.querySelector('[data-contact]');
  const result = root.querySelector('[data-result]');
  const summary = root.querySelector('[data-error-summary]');
  const rolesSet = root.querySelector('[data-roles]');
  const submit = root.querySelector('[data-submit]');
  let attempted = false;

  // Bring back an unsent message (same browser tab only), never overriding a link's choices.
  const draft = readDraft();
  DRAFT_FIELDS.forEach((n) => { if (draft[n] && form[n] && !form[n].value) form[n].value = draft[n]; });
  rolesSet.hidden = form.topic.value !== 'student';

  const showErrors = (errors) => {
    form.querySelectorAll('[data-error-for]').forEach((p) => {
      const name = p.dataset.errorFor;
      const field = form[name];
      p.textContent = errors[name] || '';
      if (field) field.setAttribute('aria-invalid', errors[name] ? 'true' : 'false');
    });
  };

  form.topic.addEventListener('change', () => {
    rolesSet.hidden = form.topic.value !== 'student';
  });

  form.addEventListener('input', () => {
    writeDraft(form);
    if (attempted) showErrors(validate(form));
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    attempted = true;
    const errors = validate(form);
    showErrors(errors);
    const keys = Object.keys(errors);
    if (keys.length) {
      summary.hidden = false;
      summary.textContent = keys.length === 1 ? 'Fix the highlighted field to send your message.' : `Fix the ${keys.length} highlighted fields to send your message.`;
      form[keys[0]].focus();
      return;
    }
    summary.hidden = true;

    const entry = collect(form);
    submit.disabled = true;
    submit.textContent = 'Sending…';
    try {
      const outcome = await deliver(entry);
      if (outcome === 'sent') clearDraft();
      renderResult(outcome, entry);
    } catch (err) {
      summary.hidden = false;
      summary.textContent = 'Your message could not be sent. Check your connection and try again.';
      console.error(err);
    } finally {
      submit.disabled = false;
      submit.textContent = 'Send message';
    }
  });

  function renderResult(outcome, entry) {
    if (outcome === 'sent') {
      result.innerHTML = String(html`<h2 class="minor-title">Message sent</h2><p>Thank you, ${entry.name}. Your message has reached the CAPRO team.</p>`);
      form.hidden = true;
    } else if (outcome === 'mail') {
      result.innerHTML = String(html`<h2 class="minor-title">Your email is ready</h2><p>Your email app should have opened with the message filled in. Send it from there to reach the CAPRO team.</p>`);
    } else {
      result.innerHTML = String(html`<h2 class="minor-title">Your message is ready</h2>
        <p>Online enquiries are not connected yet. Copy your message and send it to CAPRO through your usual ${SITE.institution} channel.</p>
        <pre class="form-result__text" data-composed>${composeText(entry)}</pre>
        <button type="button" class="btn btn--quiet" data-copy>Copy message</button>
        <p class="form-result__copied" data-copied aria-live="polite"></p>`);
      const copyBtn = result.querySelector('[data-copy]');
      copyBtn.addEventListener('click', async () => {
        const text = result.querySelector('[data-composed]').textContent;
        const note = result.querySelector('[data-copied]');
        try {
          await navigator.clipboard.writeText(text);
          note.textContent = 'Message copied.';
        } catch {
          const range = document.createRange();
          range.selectNodeContents(result.querySelector('[data-composed]'));
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          note.textContent = 'Message selected. Press Ctrl+C or Cmd+C to copy.';
        }
      });
    }
    result.hidden = false;
    result.focus();
  }
}

/* ---- src/router.js ---- */
/**
 * Hash routes (#/path?query). Hash routing works on any static host,
 * including the institute's web server, with no rewrite rules.
 * To add a page: create it in src/pages and register it here and in NAV.
 */
const ROUTES = [
  { pattern: /^\/$/, page: HomePage },
  { pattern: /^\/about\/?$/, page: AboutPage },
  { pattern: /^\/focus-areas\/?$/, page: FocusAreasPage },
  { pattern: /^\/projects\/?$/, page: ProjectsPage },
  { pattern: /^\/projects\/([a-z0-9-]+)\/?$/, page: ProjectPage },
  { pattern: /^\/students\/?$/, page: StudentsPage },
  { pattern: /^\/contact\/?$/, page: ContactPage },
];

function parseLocation() {
  const raw = window.location.hash.replace(/^#/, '');
  if (raw && !raw.startsWith('/')) return null; // in-page anchor, not a route
  const [path, query] = (raw || '/').split('?');
  return { path: path || '/', params: new URLSearchParams(query || '') };
}

function resolve({ path, params }) {
  for (const route of ROUTES) {
    const match = path.match(route.pattern);
    if (match) return route.page({ params, match, path });
  }
  return NotFoundPage();
}

/* ---- src/main.js ---- */
const header = document.querySelector('[data-site-header]');
const footer = document.querySelector('[data-site-footer]');
const main = document.getElementById('main');
const metaDescription = document.querySelector('meta[name="description"]');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

header.innerHTML = String(SiteHeader());
footer.innerHTML = String(SiteFooter());
bindMenu(header);
bindTheme(header);
mountPalette(header);

// Skip link: move focus without touching the hash (the hash is the router).
document.querySelector('.skip-link').addEventListener('click', (e) => {
  e.preventDefault();
  const target = main.querySelector('h1') || main;
  target.setAttribute('tabindex', '-1');
  target.focus();
});

// Header gets a rule once the page scrolls under it.
const sentinel = document.querySelector('[data-scroll-sentinel]');
new IntersectionObserver(([entry]) => {
  header.classList.toggle('is-scrolled', !entry.isIntersecting);
}).observe(sentinel);

let firstRender = true;
let lastPath = null;

function render() {
  const location = parseLocation();
  if (!location) return;
  const view = resolve(location);
  const samePage = location.path === lastPath;

  main.innerHTML = String(view.body);
  document.title = view.title ? `${view.title} | ${SITE.shortName}, ${SITE.institution}` : `${SITE.shortName} | ${SITE.name}, ${SITE.institution}`;
  if (metaDescription) metaDescription.setAttribute('content', view.description || SITE.description);
  markCurrentNav(header, location.path);
  if (view.mount) view.mount(main);

  const section = location.params.get('section');
  const sectionEl = section ? document.getElementById(section) : null;

  if (sectionEl) {
    sectionEl.scrollIntoView({ behavior: firstRender || reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
    if (!firstRender) sectionEl.focus({ preventScroll: true });
  } else if (!samePage || firstRender) {
    window.scrollTo(0, 0);
    if (!firstRender) {
      const h1 = main.querySelector('h1');
      if (h1) h1.focus({ preventScroll: true });
    }
  }

  if (!firstRender && !reduceMotion.matches) {
    main.classList.remove('is-entering');
    void main.offsetWidth;
    main.classList.add('is-entering');
  }
  firstRender = false;
  lastPath = location.path;
}

window.addEventListener('hashchange', render);
render();
document.documentElement.classList.add('is-ready');
})();
</script>
